arl:
  targets:
    registrations:
      - id: eventful-local
        name: Eventful Commerce Local Docker
        adapter-type: HTTP_TARGET
        environment: LOCAL
        base-url: http://127.0.0.1
        allowed-origin: http://127.0.0.1
        allowed-cidrs:
          - 127.0.0.0/8
        health-path: /actuator/health
        source-repository: eventful-commerce-sideproject
        identity-verification: CONFIGURATION_ONLY
        capabilities:
          - HEALTH
          - HTTP_API
          - STOCK_CONCURRENCY

  experiment-targets:
    registrations:
      - target-system-id: eventful-local
        adapter-id: HTTP_SCENARIO_V1
        execution-enabled: false
        host-resource-group: eventful-local
        stock-concurrency:
          endpoint: /reliability/v1/scenarios/STOCK_CONCURRENCY/executions
          max-stock: 10
          max-request-count: 20
          max-concurrency: 2
          max-quantity-per-request: 1
          execution-timeout: 30s

  # Phase 4.5: only GET checks declared here become executable candidates.
  # Set execution-enabled true only after the target URL and expected status codes are verified.
  target-specs:
    registrations:
      - target-system-id: eventful-local
        execution-enabled: false
        # Share this value with any experiment profile that reaches the same Target resources.
        host-resource-group: eventful-local
        max-batch-size: 10
        request-timeout: 5s

  # Phase 17: declarative specifications can use only this explicit authority.
  # Execution stays disabled until the paths, auth profiles, and reset checks are verified locally.
  test-spec-execution:
    registrations:
      - target-system-id: eventful-local
        execution-enabled: false
        allowed-calls:
          - method: POST
            path: /products
            auth-profile: seller
          - method: POST
            path: /orders
            auth-profile: buyer
          - method: GET
            path: /products/{id}
        auth-profiles: [seller, buyer]
        observation-sources:
          - name: harness
            kind: HARNESS_STATE
            endpoint: /harness/state
            fields: [dbStock, redisStock, redisHoldCount, orderCount]
          - name: metrics
            kind: PROMETHEUS
            endpoint: http://127.0.0.1:9090
            fields: [httpErrorRate]
            queries:
              httpErrorRate: 'sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m]))'
          # Phase 19: the Profile owns the TraceQL, exactly as it owns the PromQL above.
          # A specification names a field; it can never send a query of its own to the trace store.
          # The time range is not configured here: the engine bounds every trace read to the window
          # the trial actually ran in, so one trial can never be judged on another trial's traces.
          - name: traces
            kind: TRACE
            endpoint: http://127.0.0.1:3200
            fields: [reserveSpans, deductSpans]
            queries:
              # ${trial}는 엔진이 이 시행의 식별자로 채운다. 명세는 이 문자열에 닿지 못한다.
              # Target은 워크로드 요청의 X-ARL-Trial 헤더를 span.arl.trial 속성으로 남겨야 한다.
              reserveSpans: '{name="inventory.reserve" && span.arl.trial="${trial}"}'
              deductSpans: '{name="db.query" && span.db.table="products" && span.arl.trial="${trial}"}'
        supported-faults: [PAYMENT_FAILURE]
        infrastructure-targets: [payment-service]
        max-concurrency: 50
        max-request-count: 1000
        max-trials: 100
        state-changing-allowed: true
        reset:
          method: ENVIRONMENT_RESET
          hook:
            method: POST
            path: /harness/reset
          expected-duration: 120s
          verifications:
            - id: orderCount
              call:
                method: GET
                path: /harness/state
              expr: response.body.orderCount
              condition: orderCount == 0
              read-at:
                rule: IMMEDIATE
