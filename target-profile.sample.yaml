arl:
  targets:
    registrations:
      - id: eventful-local
        name: Eventful Commerce Local Docker
        adapter-type: HTTP_TARGET
        environment: LOCAL
        base-url: http://127.0.0.1
        allowed-origin: http://127.0.0.1
        allowed-cidrs:
          - 127.0.0.0/8
        health-path: /actuator/health
        source-repository: eventful-commerce-sideproject
        identity-verification: CONFIGURATION_ONLY
        capabilities:
          - HEALTH
          - HTTP_API
          - STOCK_CONCURRENCY

  experiment-targets:
    registrations:
      - target-system-id: eventful-local
        adapter-id: HTTP_SCENARIO_V1
        execution-enabled: false
        host-resource-group: eventful-local
        stock-concurrency:
          endpoint: /reliability/v1/scenarios/STOCK_CONCURRENCY/executions
          max-stock: 10
          max-request-count: 20
          max-concurrency: 2
          max-quantity-per-request: 1
          execution-timeout: 30s

  # Phase 4.5: only GET checks declared here become executable candidates.
  # Set execution-enabled true only after the target URL and expected status codes are verified.
  target-specs:
    registrations:
      - target-system-id: eventful-local
        execution-enabled: false
        # Share this value with any experiment profile that reaches the same Target resources.
        host-resource-group: eventful-local
        max-batch-size: 10
        request-timeout: 5s

  # Phase 17: declarative specifications can use only this explicit authority.
  # Execution stays disabled until the paths, auth profiles, and reset checks are verified locally.
  test-spec-execution:
    registrations:
      - target-system-id: eventful-local
        execution-enabled: false
        allowed-calls:
          - method: POST
            path: /products
            auth-profile: seller
          - method: POST
            path: /orders
            auth-profile: buyer
          - method: GET
            path: /products/{id}
        auth-profiles: [seller, buyer]
        observation-sources:
          - name: harness
            fields: [dbStock, redisStock, redisHoldCount, orderCount]
        supported-faults: [PAYMENT_FAILURE]
        infrastructure-targets: [payment-service]
        max-concurrency: 50
        max-request-count: 1000
        max-trials: 100
        state-changing-allowed: true
        reset:
          method: ENVIRONMENT_RESET
          hook:
            method: POST
            path: /harness/reset
          expected-duration: 120s
          verifications:
            - id: orderCount
              call:
                method: GET
                path: /harness/state
              expr: response.body.orderCount
              condition: orderCount == 0
              read-at:
                rule: IMMEDIATE
